# Mirror OBS: puts an iPhone's whole screen in OBS over Wi-Fi, through OBS
# Sharing on 7twenty8studio.com. A 7Twenty8 Studio app for the App Store
# (7-day free trial, then a one-time unlock). Not part of Versely.
#   cd Tools/MirrorOBS && xcodegen generate && open MirrorOBS.xcodeproj
# The .xcodeproj is not committed. README.md has the steps.
name: MirrorOBS

options:
  bundleIdPrefix: com.7twenty8studio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4XTR53RY2V
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "158.0.0"

targets:
  MirrorOBS:
    type: application
    platform: iOS
    sources:
      - App
      - Broadcast/Shared.swift
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.mirrorobs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mirror OBS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photo-and-video
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Portrait only, so it opts out of iPad multitasking (App Store Connect asks for every orientation otherwise).
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    entitlements:
      path: App/MirrorOBS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.7twenty8studio.mirrorobs]
    dependencies:
      - target: MirrorOBSBroadcast
      # The extension's WebRTC framework is embedded here, in the app (extensions can't embed frameworks).
      - package: WebRTC
    scheme:
      storeKitConfiguration: MirrorOBS.storekit

  MirrorOBSBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - path: Privacy/Broadcast/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Mirror OBS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/MirrorOBSBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.7twenty8studio.mirrorobs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.mirrorobs.broadcast
    dependencies:
      - package: WebRTC
        embed: false
