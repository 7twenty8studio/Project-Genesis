# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: Genesis

options:
  bundleIdPrefix: com.7twenty8studio
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Genesis.xcconfig
  Release: Config/Genesis.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"

targets:
  Genesis:
    type: application
    platform: iOS
    sources:
      - path: Genesis
    dependencies:
      - package: Sentry
        product: Sentry
      - target: GenesisWidgets
      # The Apple Watch app ships inside the iPhone app.
      - target: GenesisWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.genesis
        PRODUCT_NAME: Genesis
        # Empty until Config/Signing.xcconfig names your team (see PHASE2_SETUP.md).
        CODE_SIGN_ENTITLEMENTS: $(GENESIS_APP_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The alternate icons (Night and the seasons) in Assets.xcassets.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/Genesis-Info.plist
      properties:
        CFBundleDisplayName: Genesis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The screens are in English and Spanish (Localizable.xcstrings). Listing
        # both makes iOS offer the choice under Settings › Apps › Genesis.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        ITSAppUsesNonExemptEncryption: false
        # Listening carries on with the screen locked.
        UIBackgroundModes:
          - audio
        # The Lock Screen Live Activity while listening (Premium).
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          # One window. The shared reader state isn't built for several windows
          # yet, and restored iPad windows confused the UI tests.
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.7twenty8studio.genesis
            CFBundleURLSchemes:
              - genesis
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
          - AtkinsonHyperlegible-BoldItalic.ttf
          - Literata-Regular.ttf
          - Literata-SemiBold.ttf
          - Literata-Italic.ttf
          - EBGaramond-Regular.ttf
          - EBGaramond-SemiBold.ttf
          - EBGaramond-Italic.ttf
        # Values come from Config/Secrets.xcconfig (not committed).
        GenesisSupabaseURL: $(SUPABASE_URL)
        GenesisSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        GenesisSentryDSN: $(SENTRY_DSN)
        GenesisTermsURL: $(GENESIS_TERMS_URL)
        GenesisPrivacyURL: $(GENESIS_PRIVACY_URL)

  GenesisWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: GenesisWidgets
      - path: Genesis/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.genesis.widgets
        PRODUCT_NAME: GenesisWidgets
        CODE_SIGN_ENTITLEMENTS: $(GENESIS_WIDGET_ENTITLEMENTS)
        SKIP_INSTALL: YES
    info:
      path: Config/GenesisWidgets-Info.plist
      properties:
        CFBundleDisplayName: Genesis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  GenesisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GenesisTests
    dependencies:
      - target: Genesis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.genesis.tests
        GENERATE_INFOPLIST_FILE: YES

  GenesisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GenesisUITests
    dependencies:
      - target: Genesis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.genesis.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Genesis

  # Apple Watch: verse of the day (Premium), sent from the iPhone. Embedded in
  # the iPhone app, so every build needs the watchOS platform (Xcode ›
  # Settings › Components). ./Scripts/build.sh --watch also builds it on its own.
  GenesisWatch:
    type: application
    platform: watchOS
    sources:
      - path: GenesisWatch
      - path: Genesis/Shared/WidgetSnapshot.swift
      - path: Genesis/Shared/WatchPayload.swift
    dependencies:
      - target: GenesisWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.genesis.watchkitapp
        PRODUCT_NAME: GenesisWatch
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: $(GENESIS_WATCH_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    info:
      path: Config/GenesisWatch-Info.plist
      properties:
        CFBundleDisplayName: Genesis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.7twenty8studio.genesis

  GenesisWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: GenesisWatchWidgets
      - path: Genesis/Shared/WidgetSnapshot.swift
      - path: Genesis/Shared/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.7twenty8studio.genesis.watchkitapp.widgets
        PRODUCT_NAME: GenesisWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_ENTITLEMENTS: $(GENESIS_WATCH_ENTITLEMENTS)
        SKIP_INSTALL: YES
    info:
      path: Config/GenesisWatchWidgets-Info.plist
      properties:
        CFBundleDisplayName: Genesis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  # Everyday scheme: ⌘R runs the app, ⌘U runs the fast unit tests.
  Genesis:
    build:
      targets:
        Genesis: all
        GenesisTests: [test]
    run:
      config: Debug
      # Local App Store for trying Premium in the Simulator (⌘R from Xcode).
      storeKitConfiguration: Config/Genesis.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - GenesisTests
    archive:
      config: Release

  # UI automation: select this scheme and press ⌘U to drive the app in the Simulator.
  GenesisUITests:
    build:
      targets:
        Genesis: all
        GenesisUITests: [test]
    test:
      config: Debug
      targets:
        - GenesisUITests

  # Apple Watch app and complication (needs the watchOS platform installed).
  GenesisWatch:
    build:
      targets:
        GenesisWatch: all
    run:
      config: Debug
